version: '3.8'

services:
  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    networks:
      - app-network  # <<<<<

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile.jvm
    ports:
      - "8080:8080"
    networks:
      - app-network  # <<<<<

networks:
  app-network:
    driver: bridge